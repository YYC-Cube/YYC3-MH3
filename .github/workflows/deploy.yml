# file: .github/workflows/deploy.yml
# description: YYC³ Pages 自动部署 · 推送 main 触发 · build_type=workflow 官方部署链
# author: YanYuCloudCube Team
# version: v1.0.0
# created: 2026-10-15
# updated: 2026-10-15
# status: active
# tags: [deploy],[github-pages],[ci-cd]
#
# copyright: YanYuCloudCube Team
# license: MIT
#
# brief:
#   - 部署链：configure-pages（注入 base_path）→ vite build → upload-pages-artifact → deploy-pages
#   - BASE_PATH 由 configure-pages 输出动态注入：自定义域（mh3.yyc3.top，根基座 /）与
#     github.io 子路径基座自动适配，无需手工切换
#   - CNAME（mh3.yyc3.top）随 public/ 目录自动进入产物，Pages 侧域名校验已通过（verified）
#   - 前置要求：仓库 Settings → Pages → Build and deployment → Source = GitHub Actions（已配置）

name: Deploy Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Pages 部署同一时刻仅允许一个在途实例，避免乱序覆盖
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build artifact
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build (Vite)
        run: pnpm exec vite build
        env:
          BASE_PATH: ${{ steps.pages.outputs.base_path }}

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4

