# YYC³ scrape 回环改写代理（佐证链专用）
# 作用：Prometheus（桥接网）无法直连 Mac 回环（host 网络模式下 127.0.0.1 是 VM 回环），
# 且 Prometheus 禁止覆写 Host 头。本代理在桥接网内接收 scrape（任意 Host），
# 改写 Host 为 127.0.0.1:4174 后转发宿主机 registry-server——
# registry 的回环门禁零改动；本服务不发布任何宿主机端口，零对外暴露。
server {
  listen 80;

  location / {
    proxy_pass http://host.docker.internal:4174;
    proxy_set_header Host 127.0.0.1:4174;
    proxy_connect_timeout 2s;
    proxy_read_timeout 3s;
  }
}
